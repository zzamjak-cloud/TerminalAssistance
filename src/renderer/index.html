<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Terminal Assistance</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" id="hljs-theme" href="vendor/hljs-theme.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 상단바: 창 전체 폭 최상단 고정. 좌측 = 패널 토글 2종 + 활성 세션 정보, 우측 = 표시기·분할·우측 패널 토글 -->
  <div id="topbar">
    <div id="topbar-left">
      <button id="btn-toggle-sidebar" class="panel-toggle" title="프로젝트 사이드바 토글 (Cmd/Ctrl+I)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.7" y="2.7" width="12.6" height="10.6" rx="1.8"/><line x1="6.2" y1="2.7" x2="6.2" y2="13.3"/></svg>
      </button>
      <button id="btn-toggle-explorer" class="panel-toggle" title="탐색기 토글 (Cmd/Ctrl+O)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M1.7 4.2a1.5 1.5 0 0 1 1.5-1.5h2.9l1.6 1.8h5.1a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5H3.2a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
      </button>
      <button id="btn-help" class="panel-toggle" title="도움말 — 단축키·터미널·Git 명령어">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><circle cx="8" cy="8" r="6.3"/><path d="M6.06 6.1a2 2 0 0 1 3.89.67c0 1.33-2 2-2 2"/><circle cx="8" cy="11.4" r=".7" fill="currentColor" stroke="none"/></svg>
      </button>
      <div id="active-info">세션 없음</div>
    </div>
    <div id="topbar-actions">
      <div id="waiting-indicator" class="hidden" title="클릭 시 허가 대기 중인 세션으로 이동"></div>
      <span id="panel-codex" class="hidden" title="코덱스 남은 사용량"></span>
      <span id="panel-claude" class="hidden" title="Claude Code 남은 사용량"></span>
      <span id="panel-mem" title="시스템 메모리 사용률"></span>
      <button id="btn-settings" title="설정">⚙</button>
      <!-- 분할 모드 드롭다운: 버튼 아이콘 = 현재 모드, 목록 = 8종 (아이콘은 split-view.js 가 그린다) -->
      <div id="split-controls" aria-label="화면 분할">
        <button id="btn-split" class="split-btn" title="화면 분할" aria-haspopup="true" aria-expanded="false"></button>
        <div id="split-menu" class="hidden" role="menu"></div>
      </div>
      <button id="btn-toggle-prompts" class="panel-toggle" title="세션 기록·계획 문서·메모 패널 토글 (Cmd/Ctrl+P)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.7" y="2.7" width="12.6" height="10.6" rx="1.8"/><line x1="9.8" y1="2.7" x2="9.8" y2="13.3"/></svg>
      </button>
    </div>
  </div>
  <div id="layout">
    <aside id="sidebar">
      <div id="sidebar-head">
        <button id="btn-fold-left" class="fold-btn" title="사이드바 닫기 (Cmd/Ctrl+I)">⟨</button>
        <button id="btn-add-project" title="프로젝트 추가">＋</button>
      </div>
      <div id="project-list"></div>
    </aside>
    <div class="resize-handle" id="resize-left" title="드래그로 너비 조절"></div>
    <aside id="explorer">
      <div id="explorer-head">
        <button id="btn-fold-explorer" class="fold-btn" title="탐색기 닫기 (Cmd/Ctrl+O)">⟨</button>
        <span id="explorer-title" class="sec-title">탐색기</span>
        <button id="btn-tree-refresh" title="파일 트리 새로고침">↻</button>
        <button id="btn-tree-new" title="새 파일·폴더 만들기 (선택한 폴더 안)">＋</button>
      </div>
      <div id="file-tree" tabindex="0"></div>
    </aside>
    <div class="resize-handle" id="resize-explorer" title="드래그로 너비 조절"></div>
    <main id="main">
      <div id="term-search" class="hidden">
        <input id="term-search-input" type="text" placeholder="터미널 검색">
        <span id="term-search-count"></span>
        <button id="term-search-prev" title="이전 결과">↑</button>
        <button id="term-search-next" title="다음 결과">↓</button>
        <button id="term-search-close" title="닫기">✕</button>
      </div>
      <div id="term-row">
        <div id="term-area">
          <div class="term-pane" id="term-pane-0"></div>
          <div class="term-pane" id="term-pane-1"></div>
          <div class="term-pane" id="term-pane-2"></div>
          <div class="term-pane" id="term-pane-3"></div>
          <div class="term-pane" id="term-pane-4"></div>
          <div class="term-pane" id="term-pane-5"></div>
          <!-- 스플리터: 세로 최대 3개(4열) · 가로 최대 2개(3행) — 배치는 renderSplit 이 정한다 -->
          <div id="split-divider-v0" class="split-divider v"></div>
          <div id="split-divider-v1" class="split-divider v"></div>
          <div id="split-divider-v2" class="split-divider v"></div>
          <div id="split-divider-h0" class="split-divider h"></div>
          <div id="split-divider-h1" class="split-divider h"></div>
          <div id="empty-state">
            <h2>프로젝트를 등록하고 터미널을 시작하세요</h2>
            <p>좌측 상단 <b>＋</b> 버튼으로 프로젝트를 등록하고, 프로젝트 클릭 한 번으로 해당 경로의 터미널이 열립니다.<br>
            이미지는 <b>Cmd/Ctrl+V</b> 붙여넣기 또는 <b>드래그앤드롭</b>으로 첨부됩니다.<br>
            <b>Cmd/Ctrl+1~9</b> 세션 전환 · <b>Cmd/Ctrl+T</b> 새 세션</p>
          </div>
        </div>
      </div>
    </main>
    <div class="resize-handle" id="resize-right" title="드래그로 너비 조절"></div>
    <aside id="prompt-panel" class="hidden">
      <!-- 패널 접기 버튼은 첫 섹션(세션) 헤더에 편입 — 전용 헤더 줄 하나를 줄인다 -->
      <section id="history-panel" class="panel-sec" data-sec="claude">
        <div class="sec-head">
          <span class="chevron open">❯</span><span class="sec-title">세션</span>
          <button id="btn-claude-refresh" title="목록 새로고침">↻</button>
          <button id="btn-fold-right" class="fold-btn" title="패널 접기 (Cmd/Ctrl+P)">⟩</button>
        </div>
        <div id="claude-list" class="sec-body"></div>
      </section>
      <section id="plan-panel" class="panel-sec" data-sec="plans">
        <div class="sec-head">
          <span class="chevron open">❯</span><span class="sec-title">문서</span>
          <button id="btn-memo-add" title="현재 프로젝트에 Markdown 메모 추가">+ 메모</button>
          <button id="btn-plan-refresh" title="목록 새로고침">↻</button>
        </div>
        <div id="plan-drop-feedback" class="plan-drop-feedback" role="status" aria-live="polite" hidden></div>
        <div id="plan-list" class="sec-body"></div>
      </section>
    </aside>
  </div>

  <div id="modal-backdrop" class="hidden">
    <div id="modal"></div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script src="api.js"></script>
  <script src="theme.js"></script>
  <script src="util.js"></script>
  <script src="dnd.js"></script>
  <script src="terminal-view.js"></script>
  <script src="sidebar.js"></script>
  <!-- app.js 가 App 을 정의하고, 아래 파일들이 Object.assign 으로 영역별 메서드를 붙인다 -->
  <script src="app.js"></script>
  <script src="explorer.js"></script>
  <script src="preview.js"></script>
  <script src="editor.js"></script>
  <script src="drafts.js"></script>
  <script src="memo.js"></script>
  <script src="claude-sessions.js"></script>
  <script src="plans.js"></script>
  <script src="panel-layout.js"></script>
  <script src="split-view.js"></script>
  <script src="modals.js"></script>
  <script src="help.js"></script>
  <script src="terminal-search.js"></script>
</body>
</html>
