[package]
name = "terminal-assistance"
version = "0.11.10"
description = "AI 시대의 멀티 프로젝트 터미널 워크스페이스"
authors = ["zzamjak-cloud"]
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ~/.codex/config.toml 병합 설치용 — 사용자 설정의 포맷·주석을 보존한다
toml_edit = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
# ?쒖뒪??硫붾え由??꾪솴 ?쒖떆??(硫붾え由?議고쉶留??ъ슜)
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# WebView2 ?뚮뜑???щ옒???먮룞 蹂듦뎄??(wry 媛 ?곕뒗 踰꾩쟾怨??쇱튂?댁빞 COM ??낆씠 ?명솚??
[target."cfg(windows)".dependencies]
webview2-com = "0.38"

[profile.release]
# 諛고룷 諛붿씠?덈━ 理쒖냼??strip = true
lto = true
codegen-units = 1
